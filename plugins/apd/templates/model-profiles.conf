# APD Model Profiles — economy vs quality dial for CC pipeline agents.
#
# Format: profile|role|model|effort   (pipe-separated, # comments ignored)
#
# Roles (resolved by agent file name):
#   default      every agent not matched below (builder class — context-heavy,
#                carries the tier)
#   adversarial  adversarial-reviewer — its value is POSITIONAL: it judges the
#                diff without knowing the intent. Blindness is the mechanism,
#                not tier, so it does not need the strongest model. Keep it at
#                max EFFORT everywhere: a reviewer that saves on thinking is
#                worse than none, because it returns a verdict it did not earn.
#   reviewer     code-reviewer — deliberately NO row in any profile, so it keeps
#                its template pin (claude-opus-5 / max) under every profile.
#                This is the one agent where shortcuts cost the most.
#   supervisor   supervisor — reviews the FINAL diff (post-adversarial-fixes,
#                pre-verifier) with the spec in hand.
#
# PRECEDENCE: a missing row means "this profile does not mention that role", so
# the agent keeps whatever its template declares. It never means "reset to the
# default row". Before v6.38 `reviewer` fell back to default, which silently
# downgraded code-reviewer off its `effort: max` the moment any profile was
# applied — a profile default overriding a deliberate template value is
# backwards, and the trap would have repeated for every role added later.
#
# TOPOLOGY IS NOT A PROFILE SETTING. Every profile carries a supervisor row.
# Which roles run is the shape of the pipeline and must be constant across
# profiles; how much each role costs is what a profile decides. When row
# presence doubled as an on/off switch (v6.30: eco only), eco and burn were not
# the same pipeline at two prices but two different pipelines — cross-profile
# telemetry stopped being comparable, and drift analysis could not separate
# "worse because the model is cheaper" from "worse because a layer never ran".
# If supervision ever needs to be switched off, that must be an explicit flag.
#
# Profiles ship as intent, models are DATA — when a new model generation
# lands, update this table (or override per-project), not the script/skill.
# Per-project override: copy this file to <project>/.apd/model-profiles.conf
# and edit; the project copy wins wholesale when present.
#
# NEVER use a bare alias (`opus`, `sonnet`) in the model column. Measured on
# this corpus: agents pinned to `opus` were served claude-opus-4-8 through
# 2026-07-23 and claude-opus-5 from 2026-07-25, with no config change and no
# record anywhere in APD — the same profile silently became a different model
# mid-corpus, which makes every cross-run comparison unsound. Always pin the
# full model id; that is what makes this table DATA you can reason about.
#
# WHY NO FABLE IN AGENTS. Fable was the builder default on burn and the
# supervisor on eco. Measured cost per dispatch across this corpus: fable
# builder $71.80, opus-5 builder $41.27, sonnet-5 builder $18.78 — the burn
# default was the single most expensive line in the table. Anthropic's own
# figures put Opus 5 at max effort within 0.5% of Fable 5's peak CursorBench
# score at half the cost per task, and Opus 5 is priced identically to the model
# it replaced ($5/$25). Fable stays available on demand and as an orchestrator
# choice; it is not an agent default. (https://www.anthropic.com/news/claude-opus-5)
#
# burn   — launch week / critical features: maximum quality, token cost ignored
# cruise — daily default: same model as burn, lower dial
# eco    — small pre-scoped tasks, copy fixes, Lean runs
#
# burn and cruise differ ONLY in effort. One model, one dial — so a quality or
# duration difference between them is attributable to the dial and nothing else.
#
# UNMEASURED, on purpose: the effort values are the least evidenced part of this
# table. cruise `high` vs `xhigh`, eco `high` vs `xhigh`, and what Opus 5 at
# `max` actually costs per task are all open — there is not one `max` dispatch
# in the corpus yet. Measure with `apd report turns` (it shows the SERVED model
# per agent); do not tune these from the vendor table alone.

burn|default|claude-opus-5|max
burn|adversarial|claude-sonnet-5|max
burn|supervisor|claude-opus-5|max

cruise|default|claude-opus-5|high
cruise|adversarial|claude-sonnet-5|max
cruise|supervisor|claude-opus-5|max

eco|default|claude-sonnet-5|xhigh
eco|adversarial|claude-sonnet-5|max
eco|supervisor|claude-opus-5|max
