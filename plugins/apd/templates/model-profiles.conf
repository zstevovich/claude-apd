# APD Model Profiles — economy vs quality dial for CC pipeline agents.
#
# Format: profile|role|model|effort   (pipe-separated, # comments ignored)
#
# Roles (resolved by agent file name):
#   default      every agent not matched below (builder class — context-heavy,
#                carries the tier)
#   adversarial  adversarial-reviewer (positional value: fresh context matters
#                more than model tier — may sit one tier BELOW default;
#                never put it ABOVE default while builders run cheap)
#   reviewer     code-reviewer (optional row; falls back to default when absent)
#   supervisor   supervisor (v6.30) — frontier-model final review of the FINAL
#                diff (post-adversarial-fixes, pre-verifier). Presence of the
#                row = supervision applies to that profile; absence = off.
#                Strongest available model — it backstops cheap builders, so
#                unlike adversarial it must sit ABOVE default, never below.
#
# Profiles ship as intent, models are DATA — when a new model generation
# lands, update this table (or override per-project), not the script/skill.
# Per-project override: copy this file to <project>/.apd/model-profiles.conf
# and edit; the project copy wins wholesale when present.
#
# NEVER use a bare alias (`opus`, `sonnet`) in the model column. Measured on
# this corpus: agents pinned to `opus` were served claude-opus-4-8 through
# 2026-07-23 and claude-opus-5 from 2026-07-25, with no config change and no
# record anywhere in APD — the same profile silently became a different model
# mid-corpus, which makes every cross-run comparison unsound. Always pin the
# full model id; that is what makes this table DATA you can reason about.
#
# burn   — launch week / critical features: maximum quality, token cost ignored
# cruise — daily default: strong builders, adversarial one tier below
#          effort=high (was xhigh) — Opus 5 checks its own work and does not
#          give up, which on a high effort tier shows up as turns: measured
#          77 median turns / 528s per dispatch vs 52 / 371s for the model it
#          silently replaced. Lowering the DIAL keeps the generation; lowering
#          the MODEL would not. Re-measure with `apd report turns`.
# eco    — small pre-scoped tasks, copy fixes, Lean runs

burn|default|claude-fable-5|high
burn|adversarial|claude-opus-5|max

cruise|default|claude-opus-5|high
cruise|adversarial|claude-sonnet-5|max

eco|default|claude-sonnet-5|xhigh
eco|adversarial|claude-sonnet-5|max
eco|supervisor|claude-fable-5|max
